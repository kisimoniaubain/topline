<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Screen</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:url("https://lh3.googleusercontent.com/aida-public/AB6AXuDYAUVwAaOkpyFUFSUvgb1Ziv98XiscEwA7J0xBHtIeSutaQwg8iO4W35kamvHh12KqxIUk4kQiV6il1A6ap0zIvx81VwGpRVuM84li2XV6Cd0Yt-0EkMlZo01F39IDAwV8vqxvkq96V8spFCvxNmeqpliAakJ6IKbNB65nyOXbDj2U5lKyj3Uaa84zLWNhy5fKGX5Pl3rc6Kf23F6RpVrOz_xoIg6VWoQ7MmceV2nvZbgls9OxkX2NAw")
    center center/cover no-repeat fixed;
    position:relative;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    backdrop-filter:blur(8px);
    background:rgba(0,0,0,.25);
}

.container{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:30px;
    text-align:center;
}

/* Logo */
.logo{
    width:190px;
    animation:float 3s ease-in-out infinite;
    filter:drop-shadow(0 0 20px rgba(0,255,100,.4));
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

/* Dots */

.loading-dots{
    display:flex;
    gap:12px;
}

.loading-dots span{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#00b63f;
    animation:bounce 1.2s infinite;
}

.loading-dots span:nth-child(2){
    animation-delay:.2s;
}

.loading-dots span:nth-child(3){
    animation-delay:.4s;
}

@keyframes bounce{
    0%,80%,100%{
        transform:scale(.4);
        opacity:.4;
    }
    40%{
        transform:scale(1.2);
        opacity:1;
    }
}

.text{
    color:#fff;
    letter-spacing:4px;
    font-size:13px;
    opacity:.8;
}

/* Progress Bar */

.progress{
    width:280px;
    height:4px;
    background:rgba(255,255,255,.15);
    border-radius:30px;
    overflow:hidden;
}

.progress-fill{
    width:0%;
    height:100%;
    background:#00b63f;
    box-shadow:0 0 15px #00ff73;
    animation:loading 3s linear infinite;
}

@keyframes loading{
    from{
        width:0%;
    }
    to{
        width:100%;
    }
}
</style>

</head>
<body>

<div class="container">

    <img
        class="logo"
        src="https://lh3.googleusercontent.com/aida/AP1WRLtjpZAgAngQl7hsjR37NPTQiybGg0z4KXVGRrW5H617CFLGUq2sq_InKPc4RJhdf_rqjP9puAPO50cQyksdAv4kJ29ztgcf3xD0Ok-2j8ScICJlVnDsmH-wHS82GR4lQ3TNByY4dZHHpRs0gWWCtBVl7W2ZO19nxnNpLukInett6iKMBsOdGIS_6vMGpxgW43dURH3G0xI2l_9pFZXsYBGEUdQnTTAUBZn6vtnRY8u3K-dZDskv6pMBrsc"
        alt="Logo">

    <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="text">Challenger is loading...</div>

    <div class="progress">
        <div class="progress-fill"></div>
    </div>

</div>

<script>
// Optional: Redirect after loading

setTimeout(() => {
    // window.location.href = "home.html";
    console.log("Loading complete");
}, 3000);
</script>

</body>
</html>
