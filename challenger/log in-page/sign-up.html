<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-white tracking-tight">Join Challenger</h1>

</div>
<!-- Registration Form Panel -->
<div class="glass-panel w-full max-w-md rounded-[24px] p-8 shadow-2xl">
<form class="flex flex-col gap-5" id="registrationForm">
<!-- Full Name -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-white/90 ml-1">Full Name</label>
<div class="relative input-focus-effect rounded-xl bg-white/5 border border-white/10 transition-all">

<input class="w-full h-touch-target bg-transparent pl-12 pr-4 text-white placeholder-white/30 border-none focus:ring-0 font-body-md" placeholder="John Doe" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-white/90 ml-1">Email Address</label>
<div class="relative input-focus-effect rounded-xl bg-white/5 border border-white/10 transition-all">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-white/40 text-[20px]">mail</span>
<input class="w-full h-touch-target bg-transparent pl-12 pr-4 text-white placeholder-white/30 border-none focus:ring-0 font-body-md" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-white/90 ml-1">Password</label>
<div class="relative input-focus-effect rounded-xl bg-white/5 border border-white/10 transition-all">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-white/40 text-[20px]">lock</span>
<input class="w-full h-touch-target bg-transparent pl-12 pr-4 text-white placeholder-white/30 border-none focus:ring-0 font-body-md" placeholder="Min. 8 characters" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-white/40 hover:text-white transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-white/90 ml-1">Confirm Password</label>
<div class="relative input-focus-effect rounded-xl bg-white/5 border border-white/10 transition-all">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-white/40 text-[20px]">lock_reset</span>
<input class="w-full h-touch-target bg-transparent pl-12 pr-4 text-white placeholder-white/30 border-none focus:ring-0 font-body-md" placeholder="Repeat your password" required="" type="password"/>
</div>
</div>

<button class="mt-4 w-full h-touch-target bg-primary text-white font-title-md rounded-xl shadow-lg shadow-primary/20 hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Create Account

<!-- Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('registrationForm');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = form.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                
                // Visual feedback for interaction
                btn.disabled = true;
                btn.innerHTML = `<span class="animate-spin material-symbols-outlined">progress_activity</span> Processing...`;
                
                setTimeout(() => {
                    btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Account Created!`;
                    btn.classList.replace('bg-primary', 'bg-tertiary-container');
                    
                    // Simple reset for demo purposes
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                        btn.classList.replace('bg-tertiary-container', 'bg-primary');
                        form.reset();
                    }, 2000);
                }, 1500);
            });

            // Input interactions
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.classList.add('border-primary-fixed');
                });
                input.addEventListener('blur', () => {
                    input.parentElement.classList.remove('border-primary-fixed');
                });
            });
        });
    </script>
