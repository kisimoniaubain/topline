    }catch(_e){}</script></head><body class="font-body-md text-on-surface min-h-screen flex flex-col items-center justify-center bg-black overflow-x-hidden">
    <!-- Background Image Container -->
    <div class="fixed inset-0 z-0">
        <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida/AP1WRLuExiPgEDvsKtVX6W8UFAvfGGDMd8juuM6jTc9TGerGacUNmB00F16VkK7oFh-ujFrBu3Z7JgkmqOYAWK57ZmKWGxc8BlEOSn6gKN6pzXD0lthPkuDnEfuBP1D1s350Lc9FOXTqaaIZNns-ziO7Hqt_xYSHjp6qCbOOYc0JdOigsY4yno2VfMEGzHFiiehKpJP-0z0XsnBHjQjxpA6bwfO9rPqRPUKey0Dclpy-dOJggwf7Cu6XN0PwLXlQ');"></div>

    <!-- Main Content Canvas -->

        <!-- Branding Header - Prominent at top center -->
        <header class="text-center mb-10 animate-in fade-in slide-in-from-top-6 duration-700">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-primary-container rounded-2xl mb-4 primary-glow"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDME9e7XoqFcHWUjY15Pp68mzqE2JiASPdHscEJq1X5Sbej-98HwilVs_OziZt-BAk6KBBdin_-EACCGzdsrwuYSB-OVTf1qXBjyhbTjGcfHCb4KsBa0hxKWIEfY5QC3igDyOdSxWghMhJN8lKxQyJo8TJKFk6wlGDnUC8loVgsimSp7aob-pc2LGrRuPCCIS8lsfvqWclMpUfFuFTTimoktEYra-uN9GXreZpIwKegAbP-WrOg_pMzkt3LTEEW8l2KZvc" alt="Challenger Logo" class="w-full h-full object-contain p-2"></div>
            <h1 class="font-display-lg text-headline-lg-mobile md:text-headline-lg text-white tracking-tighter mb-1">Challenger</h1>
            <p class="font-body-md text-white/70 tracking-wide">Elevate your competitive edge.</p>
        </header>

        <!-- Glassmorphism Form Container -->
        <section class="w-full glass-card rounded-[2rem] p-8 space-y-6 animate-in fade-in zoom-in-95 duration-700 delay-100 bg-white/10 backdrop-blur-xl border border-white/10">
            <div class="space-y-4">
                <!-- Email Field -->
                <div class="space-y-1.5">
                    <label class="font-label-md text-white/90 block ml-1" for="email">Email Address</label>
                    <div class="glass-input rounded-xl h-touch-target flex items-center px-4">
                        <span class="material-symbols-outlined text-white/60 mr-3 text-xl">mail</span>
                        <input class="bg-transparent border-none focus:ring-0 text-white w-full font-body-md placeholder:text-white/40" id="email" placeholder="name@example.com" type="email">
                    </div>
                </div>

                <!-- Password Field -->
                <div class="space-y-1.5">
                    <div class="flex justify-between items-center ml-1">
                        <label class="font-label-md text-white/90" for="password">Password</label>
                        <a class="font-label-sm text-primary-fixed-dim hover:text-white transition-colors" href="#">Forgot Password?</a>
                    </div>
                    <div class="glass-input rounded-xl h-touch-target flex items-center px-4">
                        <span class="material-symbols-outlined text-white/60 mr-3 text-xl">lock</span>
                        <input class="bg-transparent border-none focus:ring-0 text-white w-full font-body-md placeholder:text-white/40" id="password" placeholder="••••••••" type="password">
                        <button class="material-symbols-outlined text-white/40 hover:text-white transition-colors text-xl" type="button">visibility</button>
                    </div>
                </div>
            </div>

            <!-- Primary CTA -->
            <button class="w-full h-touch-target bg-primary-container hover:bg-primary text-white font-title-md rounded-xl primary-glow active:scale-[0.98] transition-all flex items-center justify-center">
                Sign In
            </button>

            <!-- Divider -->
            <div class="relative flex items-center py-2">
                <div class="flex-grow border-t border-white/10"></div>
                <span class="flex-shrink mx-4 font-label-sm text-white/40 uppercase tracking-widest text-[10px]">Or continue with</span>
                <div class="flex-grow border-t border-white/10"></div>
            </div>

            <!-- Social Logins -->
            <div class="grid grid-cols-2 gap-4">
                <button class="h-touch-target glass-input rounded-xl flex items-center justify-center hover:bg-white/10 active:scale-[0.98] transition-all">
                    <img alt="Google" class="w-5 h-5 mr-2 grayscale brightness-200" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAlgvmxjNnIIOCBSJKb3qKBEGaDD-Xur7VSMJg__4Uakz-L3W5CB88TJeTmlFxwFr3OTR_ljbgVSE5saOnsZCp5XGwOI9ZPD2oOSuhw2I-vUHVlWYJmhz8yL9nfnYJoMSfOUjuX361D9e_YH9yPGPgUCtLfF5kIbYMS6MYUZnPTEQI6Fnxh2MNgxB4T7SCi7mX7KlJCqSOwxaNYXJZRGtjtIDXxV2LHLYKUbfhCO8mAO3tS5LDA00zSEQ">
                    <span class="font-label-md text-white/90">Google</span>
                </button>
                <button class="h-touch-target glass-input rounded-xl flex items-center justify-center hover:bg-white/10 active:scale-[0.98] transition-all">
                    <span class="material-symbols-outlined text-white/90 mr-2 text-xl" style="font-variation-settings: &quot;FILL&quot; 1;">apps</span>
                    <span class="font-label-md text-white/90">Apple</span>
                </button>
            </div>
        </section>

        <!-- Footer -->
        <footer class="mt-8 text-center animate-in fade-in slide-in-from-bottom-4 duration-700 delay-500">
            <p class="font-body-md text-white/70">
                New to Challenger? 
                <a class="font-label-md text-primary-fixed-dim hover:text-white transition-colors ml-1" href="#">Create Account</a>
            </p>
        </footer>
    </main>

    <script class="">
        // Micro-interaction for the Visibility toggle
        const toggleBtn = document.querySelector('button.material-symbols-outlined');
        const passInput = document.querySelector('#password');
        
        toggleBtn.addEventListener('click', () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            toggleBtn.textContent = isPass ? 'visibility_off' : 'visibility';
        });</script>

</body></html>
